services:
  db:
    image: postgres:17-alpine
    container_name: linq-postgres
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: linqdb
    ports:
      - "5433:5432"
    volumes:
      - linq_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d linqdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: linq-app
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=linqdb;Username=developer;Password=localpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  linq_data: {}
